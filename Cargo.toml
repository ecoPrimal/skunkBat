[workspace]
resolver = "2"
members = [
    "crates/skunk-bat-core",
    "crates/skunk-bat-integrations",
    "crates/skunk-bat-server",
    "crates/skunky-ingest",
]
default-members = [
    "crates/skunk-bat-server",
]

[workspace.package]
version = "0.2.22"
edition = "2024"
license = "AGPL-3.0-or-later"
repository = "https://github.com/ecoPrimals/skunkBat"
authors = ["ecoPrimals Project"]
homepage = "https://sporeprint.primals.eco"
documentation = "https://sporeprint.primals.eco/lab/"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }
unreachable_pub = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }

[profile.release]
lto = true
codegen-units = 1
strip = true

[workspace.dependencies]
# Async runtime
tokio = { version = "1.40", features = ["rt-multi-thread", "net", "io-util", "sync", "macros", "time", "fs", "signal", "process"] }

# Byte buffers
bytes = "1.8"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Error handling
thiserror = "2.0"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# CLI
clap = { version = "4", features = ["derive"] }

# tarpc (G64 Cephalization — binary UDS composition)
tarpc = { version = "0.37", features = ["tokio1", "serde-transport", "serde-transport-bincode", "unix"] }
tokio-serde = { version = "0.9", features = ["bincode"] }
futures-util = "0.3"

# HTTP client (plasmid federation)
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }

# Cryptography (BTSP Phase 3 — ChaCha20-Poly1305 encrypted framing)
chacha20poly1305 = "0.10"
hkdf = "0.12"
hmac = "0.12"
sha2 = "0.10"
base64 = "0.22"
getrandom = { version = "0.2", default-features = false, features = ["std"] }

# Virtual workspace integration tests
[package]
name = "skunk-bat-tests"
version.workspace = true
edition.workspace = true
publish = false

[lints]
workspace = true

[[test]]
name = "integration_e2e"
path = "tests/integration_e2e.rs"

[[test]]
name = "integration_beardog"
path = "tests/integration_beardog.rs"

[[test]]
name = "integration_songbird"
path = "tests/integration_songbird.rs"

[[test]]
name = "integration_toadstool"
path = "tests/integration_toadstool.rs"

[[test]]
name = "chaos_testing"
path = "tests/chaos_testing.rs"

[dependencies]
skunk-bat-core = { path = "crates/skunk-bat-core" }
skunk-bat-integrations = { path = "crates/skunk-bat-integrations" }
tokio = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["process"] }
